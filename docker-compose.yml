# Run:  docker compose up -d      Open: http://localhost:5678
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: arcvault-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Beirut
      - TZ=Asia/Beirut
      # let the workflow write JSON records to the mounted ./data folder
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}   # from .env; keeps credential exports restorable
    volumes:
      - n8n_data:/home/node/.n8n        # n8n DB + credentials (named volume: SQLite on a Windows bind mount freezes)
      - ./data:/data                    # structured output records land here

volumes:
  n8n_data:
